name: 설치본 만들기

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  test:
    name: 시험
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      # Qt 는 화면 없이 돌 때도 libEGL 을 찾는다. 없으면 PySide6 임포트부터 막힌다.
      # (여기에 || true 를 붙였다가 오타 난 꾸러미 이름이 조용히 넘어가 CI 가 깨졌다.)
      - name: Qt 가 필요로 하는 것
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1 libxkbcommon0 libdbus-1-3 \
            libfontconfig1 libfreetype6 libxrender1 libxi6 libxcb-cursor0 \
            libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-render-util0 \
            libxcb-xinerama0 libxcb-xkb1 libxkbcommon-x11-0
      - name: 파이썬 라이브러리
        run: python -m pip install -q -r requirements.txt pytest
      - name: 시험 돌리기
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests -q

  build:
    name: ${{ matrix.label }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: 윈도우
          - os: ubuntu-22.04
            label: 리눅스
    runs-on: ${{ matrix.os }}
    # 맥은 지금 만들지 않는다. packaging/macos 의 스크립트는 그대로 두었으니
    # 필요해지면 matrix 에 macos-14 · macos-13 을 도로 넣으면 된다.
    # (--smoke 가 240초 안에 끝나지 않아 아직 못 미덥다.)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Qt 가 필요로 하는 것 (리눅스)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1 libxkbcommon0 libdbus-1-3 \
            libfontconfig1 libfreetype6 libxrender1 libxi6 libxcb-cursor0 \
            libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-render-util0 \
            libxcb-xinerama0 libxcb-xkb1 libxkbcommon-x11-0

      - name: Inno Setup (윈도우)
        if: runner.os == 'Windows'
        run: choco install innosetup -y --no-progress

      - name: 파이썬 라이브러리
        run: python -m pip install -q -r requirements.txt pyinstaller

      - name: 꾸리기
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONUTF8: "1"          # 윈도우 콘솔이 cp1252 라 한글에서 넘어진다
          PYTHONIOENCODING: utf-8
        run: python scripts/package.py

      - uses: actions/upload-artifact@v4
        with:
          name: 설치본-${{ matrix.os }}
          path: build/installer/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: 배포
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: 설치본
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: 설치본/*
          generate_release_notes: true
