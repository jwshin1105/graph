[project]
name = "graphcalc"
version = "1.0.0"
description = "수학 탐구용 계산기 — 정확한 계산, 적응형 그래프, 규칙성 탐색"
requires-python = ">=3.10"
dependencies = [
    "sympy>=1.13",
    "mpmath>=1.3",
    "numpy>=1.26",
    "scipy>=1.11",
    "PySide6>=6.6",
]

[project.scripts]
graphcalc = "graphcalc.ui.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["graphcalc*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
