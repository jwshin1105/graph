<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>고급 그래프 계산기 — 점열까지 그리고, 규칙성까지 읽는다</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232563eb'/%3E%3Cpath d='M4 24C10 24 10 8 16 8s6 16 12 16' stroke='white' stroke-width='2.5' fill='none'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="styles/main.css" />
</head>
<body>
<div id="app">
  <aside id="panel">
    <header id="brand">
      <div class="brand-title">해집합 계산기</div>
      <div class="brand-sub">적응형 등고선 + 고립해(점열) 복원 + 규칙성 자동 분석</div>
    </header>

    <div id="inputs"></div>

    <div class="add-row">
      <button id="addBtn" class="btn primary">＋ 식 추가</button>
      <button id="exampleBtn" class="btn">예제</button>
      <button id="clearBtn" class="btn">전체 지움</button>
    </div>

    <section id="examples" hidden>
      <div class="ex-title">눌러서 바로 넣기</div>
      <div id="exampleList"></div>
    </section>

    <section id="analysis">
      <div class="an-empty">식 옆의 <b>분석</b> 버튼을 누르면<br />해집합의 규칙성을 찾아 드립니다.</div>
    </section>

    <footer id="foot">
      <span>드래그: 이동 · 휠: 확대(shift=세로만, alt=가로만) · Ctrl+Z: 되돌리기 · 자동 저장됨</span>
    </footer>
  </aside>

  <main id="stage">
    <canvas id="board"></canvas>
    <div id="tools">
      <button class="tool" data-act="zoomin" title="확대">＋</button>
      <button class="tool" data-act="zoomout" title="축소">－</button>
      <button class="tool" data-act="reset" title="기본 보기">⌂</button>
      <button class="tool" data-act="fit" title="해에 맞추기">⤢</button>
      <button class="tool" data-act="square" title="x·y 축 비율 1:1 로">□</button>
      <button class="tool" data-act="cross" title="곡선끼리의 교점 표시">∩</button>
      <button class="tool" data-act="theme" title="밝기 전환">◐</button>
      <button class="tool" data-act="link" title="이 화면 링크 복사">🔗</button>
      <button class="tool" data-act="png" title="PNG 저장">⬇</button>
    </div>
    <div id="status"></div>
  </main>
</div>
<script type="module" src="src/ui/app.js"></script>
</body>
</html>
